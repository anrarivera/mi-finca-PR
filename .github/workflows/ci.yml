# CI — build, lint, and test on every push and pull request.
#
# The backend Jest suite runs against a THROWAWAY Postgres service
# container. The suite's own guards (backend/src/__tests__/envSetup.ts)
# refuse to run unless TEST_DATABASE_URL is set, differs from
# DATABASE_URL, and names a database containing "test" — the same
# guards that protect the dev database locally.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    name: Frontend — build, lint, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build          # tsc -b + vite build
      - run: npm run lint
      - run: npx vitest run

  backend:
    name: Backend — typecheck + API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mifinca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mifinca_test
      JWT_ACCESS_SECRET: ci-only-access-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate    # tsc needs the generated client types
      - run: npx tsc --noEmit
      - run: npm test               # Jest + Supertest against the service DB
